<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0e14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>史萊姆捏捏工坊</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game">
  <canvas id="worldCv"></canvas>

  <!-- ===== HUD ===== -->
  <div id="hud">
    <div id="compass"><div id="cmpStrip"></div><i class="cmp-mid"></i></div>
    <div id="stats">
      <span class="hchip money" id="sMoney">¥0</span>
      <span class="hchip" id="sFans">粉絲 0</span>
      <span class="hchip" id="sTrend">流行 —</span>
    </div>
    <div id="objective"></div>
    <div id="cross"></div>
    <div id="prompt"></div>
    <div id="fxl"></div>
    <div id="log"></div>
    <div id="bottom">
      <div id="xpbar"><i></i><span></span></div>
      <div id="hotbar"></div>
    </div>
    <div id="topbtns">
      <button class="hbtn" data-act="inv" aria-label="背包"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M9 7V5h6v2M4 12h16"/></svg></button>
      <button class="hbtn" data-act="pause" aria-label="選單"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
    <div id="touch">
      <div id="joyBase"><div id="joyKnob"></div></div>
      <button class="tbtn" id="btnJump" aria-label="跳躍"><svg viewBox="0 0 24 24"><path d="M12 19V6M6 11l6-6 6 6"/></svg></button>
      <button class="tbtn big" id="btnAct" aria-label="互動"><svg viewBox="0 0 24 24"><path d="M9 11V5a1.5 1.5 0 013 0v5M12 10V4a1.5 1.5 0 013 0v6M15 10V6a1.5 1.5 0 013 0v7c0 4-2.5 7-6 7s-5-2-6.5-4.5L4 13a1.5 1.5 0 012.5-1.5L9 14"/></svg></button>
      <button class="tbtn" id="btnRun" aria-label="奔跑"><svg viewBox="0 0 24 24"><path d="M13 4l-3 7h5l-4 9"/></svg></button>
    </div>
    <div id="startHint" hidden></div>
  </div>

  <!-- ===== 介面視窗（工作站 / 背包 / 選單） ===== -->
  <div id="gui" hidden>
    <div class="gwin" id="gwin">
      <div class="ghead"><div id="gtitle"></div><div id="gtabs"></div><button class="gclose" data-act="closeGui" aria-label="關閉"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="gbody" id="gbody">

        <section class="panel" id="p-make">
          <div id="gelPick" class="row wrap"></div>
          <div id="mini" class="card"></div>
          <div id="makeResult"></div>
          <div id="machLegend" class="row wrap small"></div>
        </section>

        <section class="panel" id="p-decor">
          <div class="stagewrap sq"><canvas id="decorCv"></canvas></div>
          <div id="decorStock" class="strip"></div>
          <div id="decoTools" class="card"></div>
        </section>

        <section class="panel" id="p-live">
          <div class="stagewrap live" id="liveWrap">
            <canvas id="liveCv"></canvas>
            <div class="ov tl"><span class="badge" id="liveBadge">OFF AIR</span> <span id="liveViewers">0 觀眾</span></div>
            <div class="ov tr"><div class="meter"><i id="hypeBar"></i></div><small id="comboTxt"></small></div>
            <div class="ov req" id="reqBox"></div>
            <div class="ov dm" id="danmaku"></div>
            <div class="ov bl" id="donate"></div>
          </div>
          <div class="row liverow">
            <button class="btn big" data-act="toggleLive" id="btnLive">開始直播</button>
            <div id="stageInfo" class="grow small"></div>
          </div>
          <div id="liveStock" class="strip"></div>
          <div id="chat" class="chat"></div>
          <details class="fold">
            <summary>直播定價</summary>
            <div class="hint">直播為主動銷售：單價較高（×1.4），但需要你親自捏出人氣。價格過高需求下降，過低則利潤不足。</div>
            <div id="livePrice"></div>
          </details>
        </section>

        <section class="panel" id="p-web">
          <div id="webInfo" class="card"></div>
          <div class="hint">被動收入：即使不直播也會有顧客上門（離線最多結算 30 分鐘）。單價較低，但顧客會留下評價。</div>
          <h3>貨架（點擊下架）</h3>
          <div id="webShelf" class="grid"></div>
          <h3>庫存（點擊上架）</h3>
          <div id="webStock" class="grid"></div>
          <details class="fold"><summary>網站定價</summary><div id="webPrice"></div></details>
          <h3>最新評價</h3>
          <div id="reviews" class="card small"></div>
        </section>

        <section class="panel" id="p-up"><div id="upList"></div></section>

        <section class="panel" id="p-branch">
          <div class="stagewrap mk" id="facWrap" hidden><canvas id="facCv"></canvas></div>
          <div id="branchBody"></div>
        </section>

        <section class="panel" id="p-codex"><div id="codexBody"></div></section>

        <section class="panel" id="p-inv">
          <div id="invGrid" class="invgrid"></div>
          <div id="invInfo" class="card small"></div>
          <div id="questBox" class="card quest"></div>
        </section>

        <section class="panel" id="p-pause">
          <div class="menu">
            <button class="btn big" data-act="closeGui">回到遊戲</button>
            <button class="btn big ghost" data-act="sound" id="btnSound">音效：開</button>
            <button class="btn big ghost" data-act="sens" id="btnSens">視角靈敏度：中</button>
            <button class="btn big ghost" data-act="help">操作說明</button>
            <button class="btn big ghost" data-act="home">傳送回工坊</button>
            <button class="btn big red" data-act="reset">重置存檔</button>
          </div>
        </section>

      </div>
    </div>
  </div>
</div>

<div id="modal" hidden><div class="mbox" id="mbox"></div></div>
<div id="login" hidden>
  <div class="login-card">
    <div class="lslime" aria-hidden="true"><i></i><i></i><em></em><em></em></div>
    <div class="lshadow" aria-hidden="true"></div>
    <div class="lkicker">SQUISH LAB</div>
    <h1>史萊姆捏捏工坊</h1>
    <p class="lsub">走進月光谷，採集、加工、直播你的酥脆捏捏</p>
    <form id="loginForm" autocomplete="off">
      <div class="lfield">
        <input id="loginCode" type="password" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="輸入遊玩金鑰" aria-label="遊玩金鑰">
        <button type="button" id="loginEye" aria-label="顯示或隱藏金鑰">👁</button>
      </div>
      <button class="btn big" id="loginBtn" type="submit">進入工坊</button>
    </form>
    <div id="loginMsg" class="lmsg" role="alert"></div>
  </div>
</div>
<div id="boot" hidden><div class="bootc"><div class="spin"></div><div id="bootTxt">正在生成月光谷…</div></div></div>
<script src="vendor/three.min.js"></script>
<script src="gate.js"></script>
</body>
</html>
