<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0e14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>史萊姆捏捏工坊</title>
<link rel="stylesheet" href="style.css?v=dev">
</head>
<body>
<div id="game">
  <canvas id="worldCv"></canvas>

  <!-- ===== HUD ===== -->
  <div id="hud">
    <div id="compass"><div id="cmpStrip"></div><i class="cmp-mid"></i></div>
    <div id="stats">
      <span class="hchip money" id="sMoney">¥0</span>
      <span class="hchip" id="sFans">粉絲 0</span>
      <span class="hchip" id="sTrend">流行 —</span>
      <span class="hchip net" id="sNet" hidden></span>
    </div>
    <div id="objective"></div>
    <div id="vig"></div>
    <div id="cross"></div>
    <svg id="ring" viewBox="0 0 48 48" aria-hidden="true"></svg>
    <div id="prompt"></div>
    <div id="fxl"></div>
    <div id="log"></div>
    <div id="bottom">
      <div id="xpbar"><i></i><span></span></div>
      <div id="hotbar"></div>
    </div>
    <div id="topbtns">
      <button class="hbtn" data-act="chat" id="btnChat" aria-label="聊天" hidden><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
      <button class="hbtn" data-act="inv" aria-label="背包"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M9 7V5h6v2M4 12h16"/></svg></button>
      <button class="hbtn" data-act="pause" aria-label="選單"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
    <div id="touch">
      <div id="joyBase"><div id="joyKnob"></div></div>
      <button class="tbtn" id="btnJump" aria-label="跳躍"><svg viewBox="0 0 24 24"><path d="M12 19V6M6 11l6-6 6 6"/></svg></button>
      <button class="tbtn big" id="btnAct" aria-label="互動"><svg viewBox="0 0 24 24"><path d="M9 11V5a1.5 1.5 0 013 0v5M12 10V4a1.5 1.5 0 013 0v6M15 10V6a1.5 1.5 0 013 0v7c0 4-2.5 7-6 7s-5-2-6.5-4.5L4 13a1.5 1.5 0 012.5-1.5L9 14"/></svg></button>
      <button class="tbtn" id="btnRun" aria-label="奔跑"><svg viewBox="0 0 24 24"><path d="M13 4l-3 7h5l-4 9"/></svg></button>
      <button class="tbtn" id="btnSneak" aria-label="潛行"><svg viewBox="0 0 24 24"><path d="M8 3c-1.7 0-2.5 2-2.5 4.5S6.6 12 8 12s2.3-2 2.3-4.5S9.7 3 8 3zM6.5 14.5h3.2l-.4 3.2a1.6 1.6 0 01-3.2-.3zM16 8c-1.6 0-2.4 2-2.4 4.3s.9 4.2 2.4 4.2 2.4-1.9 2.4-4.2S17.6 8 16 8zM14.6 18.6h3l-.3 2a1.5 1.5 0 01-2.9-.2z"/></svg></button>
    </div>
    <div id="startHint" hidden></div>
    <div id="chatBar" hidden><input id="chatIn" maxlength="60" placeholder="輸入訊息，Enter 送出，Esc 取消" autocomplete="off"></div>
  </div>

  <!-- ===== 介面視窗（工作站 / 背包 / 選單） ===== -->
  <div id="gui" hidden>
    <div class="gwin" id="gwin">
      <div class="ghead"><div id="gtitle"></div><div id="gtabs"></div><button class="gclose" data-act="closeGui" aria-label="關閉"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="gbody" id="gbody">

        <section class="panel" id="p-make">
          <div id="gelPick" class="row wrap"></div>
          <div id="mini" class="card"></div>
          <div id="makeResult"></div>
          <div id="machLegend" class="row wrap small"></div>
        </section>

        <section class="panel" id="p-decor">
          <div class="stagewrap sq"><canvas id="decorCv"></canvas></div>
          <div id="decorStock" class="strip"></div>
          <div id="decoTools" class="card"></div>
        </section>

        <section class="panel" id="p-live">
          <div id="liveOthers"></div>
          <div class="stagewrap live" id="liveWrap">
            <canvas id="liveCv"></canvas>
            <div class="ov tl"><span class="badge" id="liveBadge">OFF AIR</span> <span id="liveViewers">0 觀眾</span></div>
            <div class="ov tr"><div class="meter"><i id="hypeBar"></i></div><small id="comboTxt"></small></div>
            <div class="ov req" id="reqBox"></div>
            <div class="ov dm" id="danmaku"></div>
            <div class="ov bl" id="donate"></div>
          </div>
          <div class="row watchbar" id="watchBar" hidden>
            <input id="lchatIn" maxlength="40" placeholder="傳訊息給主播…" autocomplete="off">
            <button class="btn sm" data-act="lchatSend">送出</button>
            <button class="btn sm ghost" data-act="donate">斗內 ¥20</button>
            <button class="btn sm red" data-act="unwatch">離開</button>
          </div>
          <div id="liveOwn">
            <div class="row liverow">
              <button class="btn big" data-act="toggleLive" id="btnLive">開始直播</button>
              <div id="stageInfo" class="grow small"></div>
            </div>
            <div id="liveStock" class="strip"></div>
          </div>
          <div id="chat" class="chat"></div>
          <details class="fold" id="livePriceFold">
            <summary>直播定價</summary>
            <div class="hint">直播為主動銷售：單價較高（×1.4），但需要你親自捏出人氣。價格過高需求下降，過低則利潤不足。</div>
            <div id="livePrice"></div>
          </details>
        </section>

        <section class="panel" id="p-web">
          <div id="webInfo" class="card"></div>
          <div class="hint">被動收入：即使不直播也會有顧客上門（離線最多結算 30 分鐘）。單價較低，但顧客會留下評價。</div>
          <h3>貨架（點擊下架）</h3>
          <div id="webShelf" class="grid"></div>
          <h3>庫存（點擊上架）</h3>
          <div id="webStock" class="grid"></div>
          <details class="fold"><summary>網站定價</summary><div id="webPrice"></div></details>
          <h3>最新評價</h3>
          <div id="reviews" class="card small"></div>
        </section>

        <section class="panel" id="p-up"><div id="upList"></div></section>

        <section class="panel" id="p-branch">
          <div class="stagewrap mk" id="facWrap" hidden><canvas id="facCv"></canvas></div>
          <div id="branchBody"></div>
        </section>

        <section class="panel" id="p-codex"><div id="codexBody"></div></section>

        <section class="panel" id="p-inv">
          <div id="invGrid" class="invgrid"></div>
          <div id="invInfo" class="card small"></div>
          <div id="questBox" class="card quest"></div>
        </section>

        <section class="panel" id="p-bench"><div id="benchBody"></div></section>

        <section class="panel" id="p-mapg"><div id="mapBody"></div></section>

        <section class="panel" id="p-pause">
          <div class="menu">
            <button class="btn big" data-act="closeGui">回到遊戲</button>
            <button class="btn big ghost" data-act="saveNow">儲存遊戲</button>
            <div id="pauseNet"></div>
            <div class="row"><button class="btn ghost grow" data-act="sound" id="btnSound">音效：開</button><button class="btn ghost grow" data-act="sens" id="btnSens">靈敏度：中</button></div>
            <div class="row"><button class="btn ghost grow" data-act="help">操作說明</button><button class="btn ghost grow" data-act="home">回到中央平地</button></div>
            <button class="btn big red" data-act="toTitle">儲存並回到主選單</button>
            <div class="small" id="saveInfo" style="text-align:center;color:var(--sub)"></div>
          </div>
        </section>

      </div>
    </div>
  </div>
</div>

<div id="title" hidden>
  <div class="tbox">
    <div class="tlogo"><i class="logo"></i>SQUISH LAB</div>
    <div class="tsub">史萊姆捏捏工坊</div>
    <div id="titleMain" class="tmenu"></div>
    <div id="titleMp" class="tmenu" hidden>
      <label class="small">玩家名稱<input id="mpName" maxlength="12" placeholder="你的名字" autocomplete="off"></label>
      <button class="btn big" data-act="mpHost">建立房間</button>
      <div class="row"><input id="mpCode" maxlength="6" placeholder="輸入房間代碼" autocomplete="off" style="text-transform:uppercase;margin:0"><button class="btn" data-act="mpJoin">加入</button></div>
      <div id="mpStatus" class="small" style="min-height:18px;color:var(--warn)"></div>
      <button class="btn ghost" data-act="tBack">返回</button>
      <div class="hint" style="margin:0">多人連線透過 PeerJS 公共伺服器建立點對點連線。每位玩家保有自己的存檔；玩家位置、世界中的史萊姆與直播狀態會即時同步。</div>
    </div>
    <div class="tfoot" id="titleFoot"></div>
  </div>
</div>
<div id="fade" hidden></div>
<div id="modal" hidden><div class="mbox" id="mbox"></div></div>
<div id="login" hidden>
  <div class="login-card">
    <div class="lslime" aria-hidden="true"><i></i><i></i><em></em><em></em></div>
    <div class="lshadow" aria-hidden="true"></div>
    <div class="lkicker">SQUISH LAB</div>
    <h1>史萊姆捏捏工坊</h1>
    <p class="lsub">走進月光谷，採集、加工、直播你的酥脆捏捏</p>
    <form id="loginForm" autocomplete="off">
      <div class="lfield">
        <input id="loginCode" type="password" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="輸入遊玩金鑰" aria-label="遊玩金鑰">
        <button type="button" id="loginEye" aria-label="顯示或隱藏金鑰">👁</button>
      </div>
      <button class="btn big" id="loginBtn" type="submit">進入工坊</button>
    </form>
    <div id="loginMsg" class="lmsg" role="alert"></div>
  </div>
</div>
<div id="boot" hidden><div class="bootc"><div class="spin"></div><div id="bootTxt">正在生成月光谷…</div></div></div>
<script src="vendor/three.min.js"></script>
<script src="vendor/peerjs.min.js"></script>
<script src="gate.js?v=dev"></script>
</body>
</html>
