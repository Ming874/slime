<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0e14">
<meta name="robots" content="noindex">
<title>允許名單管理｜史萊姆捏捏工坊</title>
<style>
  :root{--bg:#0a0e14;--card:#151d29;--line:#263243;--tx:#e6edf5;--sub:#8b9bb0;--acc:#22d3ee;--good:#34d399;--warn:#fbbf24;--red:#fb7185}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 "Inter","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
  main{max-width:880px;margin:0 auto;padding:28px 16px 60px}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  header h1{margin:0;font-size:22px;flex:1;min-width:200px}
  a{color:var(--acc)}
  .kicker{font:800 12px/1 Inter,sans-serif;letter-spacing:4px;color:var(--acc);margin-bottom:6px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  .card h2{margin:0 0 4px;font-size:16px}
  .sub{color:var(--sub);font-size:13px}
  textarea,input[type=text],input[type=search]{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
  textarea{min-height:92px;resize:vertical}
  textarea:focus,input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px #22d3ee26}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .grow{flex:1;min-width:160px}
  .btn{background:var(--acc);border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:700;color:#03212a;cursor:pointer;min-height:40px;text-decoration:none;display:inline-flex;align-items:center}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
  .btn.sm{padding:4px 10px;min-height:32px;font-size:13px}
  .btn.red{background:transparent;color:var(--red);border:1px solid #fb718566}
  label.chk{display:flex;gap:8px;align-items:center;color:var(--sub);font-size:14px;cursor:pointer}
  .msg{min-height:22px;margin-top:8px;font-size:14px}
  .msg.err{color:var(--red)} .msg.ok{color:var(--good)}
  .list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
  .item .who{font-weight:700;word-break:break-all}
  .item .meta{grid-column:1;color:var(--sub);font-size:12.5px}
  .item .acts{grid-row:1/span 2;grid-column:2;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:0 7px;margin-left:6px;vertical-align:1px;border:1px solid var(--line);color:var(--sub)}
  .tag.admin{color:var(--warn);border-color:#fbbf2466}
  .tag.dom{color:var(--acc);border-color:#22d3ee55}
  .empty{color:var(--sub);padding:14px;text-align:center}
  @media (max-width:560px){.item{grid-template-columns:1fr}.item .acts{grid-row:auto;grid-column:1;justify-content:flex-start}}
</style>
</head>
<body>
<main>
  <header>
    <div style="flex:1;min-width:200px">
      <div class="kicker">SQUISH LAB</div>
      <h1>允許名單管理</h1>
    </div>
    <a class="btn ghost" href="/">回到遊戲</a>
  </header>

  <div id="gate" class="card" hidden></div>

  <div id="app" hidden>
    <section class="card">
      <h2>加入可以登入的帳號</h2>
      <div class="sub">完整信箱（someone@gmail.com）只開放那一個帳號；網域（@school.edu.tw）開放整個學校；<code>*</code> 開放所有 Google 帳號。可以一次貼很多個，用換行、逗號或空白分隔。</div>
      <form id="addForm">
        <div class="row"><textarea id="entries" placeholder="student01@gmail.com&#10;@xxx.edu.tw" autocomplete="off" spellcheck="false" aria-label="信箱或網域"></textarea></div>
        <div class="row">
          <input type="text" id="note" class="grow" maxlength="40" placeholder="備註（例如：三年二班）" aria-label="備註">
          <label class="chk"><input type="checkbox" id="asAdmin"> 設為管理員（只適用完整信箱）</label>
          <button class="btn" type="submit" id="addBtn">加入名單</button>
        </div>
        <div id="addMsg" class="msg" role="status"></div>
      </form>
    </section>

    <section class="card">
      <div class="row" style="margin-top:0">
        <h2 class="grow" style="margin:0">目前名單 <span id="count" class="sub"></span></h2>
        <input type="search" id="filter" class="grow" placeholder="搜尋信箱、網域或備註" aria-label="搜尋">
      </div>
      <div id="listMsg" class="msg err" role="alert"></div>
      <div id="list" class="list"></div>
    </section>
  </div>
</main>
<script src="admin.js"></script>
</body>
</html>
